# Valores personalizados para desarrollo
replicaCount: 1

image:
  repository: travel-track-api
  pullPolicy: IfNotPresent
  tag: "1.0.0"

namespace:
  create: true
  name: travel-track-dev

config:
  nodeEnv: development
  port: "3000"
  appVersion: "1.0.0"
  appName: travel-track-api
  logLevel: debug

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
