apiVersion: v1
kind: Pod
metadata:
  name: test-non-compliant-pod
  namespace: travel-track
  labels:
    app: test-pod
spec:
  containers:
  - name: test-container
    # Violación 1: Usa tag 'latest'
    image: nginx:latest
    # Violación 2: No tiene límites de recursos
    # Violación 3: No especifica runAsNonRoot, por lo que puede ejecutarse como root
    ports:
    - containerPort: 80

