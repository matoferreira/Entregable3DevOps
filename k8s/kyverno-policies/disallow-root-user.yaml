apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: "Disallow Root User"
    policies.kyverno.io/category: "Security"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: >-
      Running containers as root user is a security risk. Containers should
      run as a non-root user to follow the principle of least privilege.
spec:
  validationFailureAction: enforce
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
        - resources:
            kinds:
              - Pod
            namespaces:
              - "travel-track"
      validate:
        message: "Running as root user is not allowed. Containers must run as non-root."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): "true"
            containers:
            - name: "*"
              =(securityContext):
                =(runAsNonRoot): "true"
                =(runAsUser): ">0"

