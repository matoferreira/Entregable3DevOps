apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: "Require Resource Limits"
    policies.kyverno.io/category: "Best Practices"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: >-
      Requiring resource requests and limits ensures that containers have
      appropriate resource constraints set. This helps prevent resource exhaustion
      and ensures fair resource allocation in the cluster.
spec:
  validationFailureAction: enforce
  background: true
  rules:
    - name: check-resource-requests
      match:
        any:
        - resources:
            kinds:
              - Pod
            namespaces:
              - "travel-track"
      validate:
        message: "Resource requests and limits are required for all containers."
        pattern:
          spec:
            containers:
            - name: "*"
              resources:
                requests:
                  memory: "?*"
                  cpu: "?*"
                limits:
                  memory: "?*"
                  cpu: "?*"

